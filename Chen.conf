[MITM]

不在公开配置中放置 CA 私钥。

首次使用请在 Shadowrocket：

配置文件 → ⓘ → HTTPS 解密 → 证书 → 生成新的 CA 证书 → 安装

然后到 iOS：

设置 → 通用 → 关于本机 → 证书信任设置 → 开启 Shadowrocket CA

enable = true
hostname = *.google.cn
